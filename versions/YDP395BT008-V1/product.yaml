copy:
  slogan_zh: 方形 TFT 模组 · MIPI · ST7102 · In-Cell（ST7123）
  slogan_en: Square TFT module · MIPI · ST7102 · In-Cell (ST7123)
  intro_zh: OSPTEK **3.95 寸 480×480 TFT** 是一款 **MIPI** 接口彩色显示模组，显示驱动为 **ST7102**，触摸为 **In-Cell（ST7123）**。适合方形 HMI、仪表与中尺寸交互面板等场景。
  intro_en: OSPTEK **3.95″ 480×480 TFT** is a **MIPI** color display module driven by **ST7102**, with **In-Cell** capacitive touch (**ST7123**). Suited to square HMI, instruments, and mid-size interactive panels.
  version_note_zh: 当前模组版本：**YDP395BT008-V1**。电气与外形细节以 [`docs/YDP395BT008-V1.pdf`](./docs/YDP395BT008-V1.pdf) 为准。
  version_note_en: 'Current module version: **YDP395BT008-V1**. Electrical and mechanical details follow [`docs/YDP395BT008-V1.pdf`](./docs/YDP395BT008-V1.pdf).'
  panel_type_zh: TFT / IPS（彩色）
  panel_type_en: TFT / IPS (color)
  touch_en: ST7123 (In-Cell)
  spec_note_zh: 完整外形尺寸、FPC 定义、供电与时序以产品规格书 / 驱动手册为准。
  spec_note_en: Full outline, FPC definition, power, and timing follow the product datasheet / driver IC datasheet.
  nav_note_zh: In-Cell，带触摸（ST7123）。
  nav_note_en: In-Cell; with touch (ST7123).
