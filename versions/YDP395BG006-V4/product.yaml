copy:
  slogan_zh: 方形 TFT 模组 · MIPI · ST7102 · 电容触摸
  slogan_en: Square TFT module · MIPI · ST7102 · capacitive touch
  intro_zh: OSPTEK **3.95 寸 480×480 TFT** 是一款 **MIPI** 接口彩色显示模组，显示驱动为 **ST7102**，触摸驱动为 **ST7123**。与 **YDP395B007-V4** 电气接口与示例程序相同，盖板不同。适合方形 HMI、仪表与中尺寸交互面板等场景。
  intro_en: OSPTEK **3.95″ 480×480 TFT** is a **MIPI** color display module driven by **ST7102**, with touch **ST7123**. Electrical interface and sample code match **YDP395B007-V4**; cover glass differs. Suited to square HMI, instruments, and mid-size panels.
  version_note_zh: 当前模组版本：**YDP395BG006-V4**。外形与机械尺寸以 [`docs/YDP395BG006-V4_外形图.pdf`](./docs/YDP395BG006-V4_%E5%A4%96%E5%BD%A2%E5%9B%BE.pdf) 为准。
  version_note_en: 'Current module version: **YDP395BG006-V4**. Mechanical outline follows [`docs/YDP395BG006-V4_外形图.pdf`](./docs/YDP395BG006-V4_%E5%A4%96%E5%BD%A2%E5%9B%BE.pdf).'
  panel_type_zh: TFT / IPS（彩色）
  panel_type_en: TFT / IPS (color)
  spec_note_zh: 完整外形尺寸、FPC 定义、供电与时序以 CAD / 转接板资料 / 驱动手册为准。
  spec_note_en: Full outline, FPC definition, power, and timing follow the CAD / adapter docs / driver IC datasheet.
  nav_note_zh: 带触摸（ST7123）；与 YDP395B007-V4 接口/示例相同，盖板不同。
  nav_note_en: With touch (ST7123); same interface/samples as YDP395B007-V4, different cover glass.
